[package]
name = "henad-app"
default-run = "henad-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Lets an external inspector (egui_mcp) drive the app. Off unless asked for, and inert at runtime
# until EGUI_INSPECTION is set.
inspection = ["eframe/inspection"]

[dependencies]
henad-core = { workspace = true }
henad-compute = { workspace = true }
henad-models = { workspace = true }
egui = { workspace = true }
egui_dock = { workspace = true }
eframe = { workspace = true }
egui_plot = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
rayon = { workspace = true }
flume = { workspace = true }
web-time = { workspace = true }

# native:
[build-dependencies]
wgsl_bindgen = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-rayon = { workspace = true }
web-sys = { workspace = true }

[lints]
workspace = true
