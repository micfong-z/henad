[package]
name = "henad-app"
default-run = "henad-app"
version.workspace = true
description = "Desktop and web app for Henad, a parallel agent-based modelling engine."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
# The workspace's licence, with the fonts the library embeds: IBM Plex derivatives under OFL-1.1 and two icon fonts
# under Apache-2.0 alone. `assets/fonts/SOURCES.md` lists each.
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/henad-app"
readme = "README.md"
keywords = ["agent-based-model", "simulation", "egui", "gui", "visualization"]
categories = ["simulation", "science", "visualization", "gui"]

[lib]
path = "src/lib.rs"

# The official binary opens the example models. A host with models of its own calls `henad_app::run_native` or
# `henad_app::start_web`.
[[bin]]
name = "henad-app"
path = "src/main.rs"
required-features = ["example-models"]

[features]
default = ["example-models"]
# The ten example models, and the logger of the official binary.
example-models = ["dep:henad-models", "dep:env_logger"]
# Lets an external inspector (egui_mcp) drive the app. Off unless asked for, and inert at runtime
# until EGUI_INSPECTION is set.
inspection = ["eframe/inspection"]

[dependencies]
henad-core = { workspace = true }
henad-compute = { workspace = true }
henad-models = { workspace = true, optional = true }
henad-explore = { workspace = true }
egui = { workspace = true }
egui_dock = { workspace = true }
egui_extras = { workspace = true }
eframe = { workspace = true }
egui_plot = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
rayon = { workspace = true }
flume = { workspace = true }
rfd = { workspace = true }
serde_json = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
henad-models = { workspace = true }
# The headless device of the tests.
henad-explore = { workspace = true, features = ["testing"] }

# native:
[build-dependencies]
henad-build = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true, optional = true }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
send_wrapper = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Navigator",
    "Node",
    "Url",
    "Window",
] }

# A wasm32 build without atomics, as docs.rs makes, has no thread pool and runs the models on one thread.
# wasm-bindgen-rayon refuses to compile there.
[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
wasm-bindgen-rayon = { workspace = true }

[lints]
workspace = true

# The wasm32 docs build without atomics, and so without the thread pool.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
rustdoc-args = ["--cfg", "docsrs"]
