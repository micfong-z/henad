[package]
name = "henad-cli"
version.workspace = true
description = "Command-line benchmark and sweep runner for Henad, a parallel agent-based modelling engine."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/henad-cli"
readme = "README.md"
keywords = ["agent-based-model", "simulation", "benchmark", "parameter-sweep", "cli"]
categories = ["simulation", "science", "command-line-utilities"]
# The golden tests and their 0.2.0 reference output stay in the repository.
exclude = ["/tests/"]

[[bin]]
name = "henad-cli"
path = "src/main.rs"

[dependencies]
# We drive states directly (CPU via `SimState::step`, GPU via `GpuSimState::encode_steps`) rather
# than through `SimThread`/`GpuSimThread`. henad-compute is needed for the GPU path: `GpuContext`,
# the `GpuSimState` runner trait and its stepping helpers. henad-explore acquires the headless device.
henad-core = { workspace = true }
henad-compute = { workspace = true }
henad-models = { workspace = true }
henad-explore = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
numfmt = { workspace = true }
# `--json` writes the harness protocol lines, `--threads` sizes rayon's global pool.
serde_json = { workspace = true }
rayon = { workspace = true }

[build-dependencies]
henad-build = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
