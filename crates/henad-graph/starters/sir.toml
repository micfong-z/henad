# SIR as a graph model. The step draws counter-based numbers, so it matches the stock gpu_sir at tick 0 alone, and
# the action uses the press-seed form of the stock seed_outbreak.wgsl.
format = "henad-model"
format_version = 1
kind = "graph"
id = "node_sir"
name = "SIR Epidemic"
description = "Classic SIR compartmental model on a 2D grid with Moore neighborhood"

[graph]
topology = "grid"
library = 1

[[target]]
backend = "gpu"
id = "node_sir"
name = "SIR Epidemic (GPU)"
description = "Classic SIR compartmental model on a toroidal grid with Moore neighborhood, stepped entirely on the GPU"

[grid]
width = 1024
height = 1024
boundary = "torus"

[[category]]
id = "health"
variants = [
  { name = "S", label = "Susceptible", color = [0, 122, 245, 255] },
  { name = "I", label = "Infected", color = [228, 55, 72, 255] },
  { name = "R", label = "Recovered", color = [128, 128, 128, 255] },
]

[[lane]]
id = "health"
domain = "cells"
type = "cat:health"
storage = "u8"
initial = { cat = "health.S" }

[[param]]
id = "infection_rate"
label = "Infection Rate"
kind = "f32"
min = 0.0
max = 1.0
default = 0.3
step = 0.01

[[param]]
id = "recovery_rate"
label = "Recovery Rate"
kind = "f32"
min = 0.0
max = 1.0
default = 0.05
step = 0.01

[[param]]
id = "initial_infected_pct"
label = "Initial Infected"
kind = "f32"
min = 0.0
max = 1.0
default = 0.01
step = 0.001
format = "percent"

[[stat]]
label = "Susceptible"
from = "n31.S"
color = [0, 122, 245, 255]

[[stat]]
label = "Infected"
from = "n31.I"
color = [228, 55, 72, 255]

[[stat]]
label = "Recovered"
from = "n31.R"
color = [128, 128, 128, 255]

[[action]]
id = "seed_outbreak"
label = "Seed outbreak"
runs = []

[[pass]]
id = "seed"
stage = "init"
kind = "map"
domain = "cells"
enabled = true
draw_order = ["n2"]

[[pass.node]]
id = "n1"
op = "rng.threshold"
in.p = { param = "initial_infected_pct" }

[[pass.node]]
id = "n2"
op = "stream.bits"
in.when = { bool = true }

[[pass.node]]
id = "n3"
op = "cmp.lt"
in.a = "n2"
in.b = "n1"

[[pass.node]]
id = "n4"
op = "logic.select"
in.cond = "n3"
in.if_true = { cat = "health.I" }
in.if_false = { cat = "health.S" }

[[pass.node]]
id = "n5"
op = "lane.set"
config.lane = "health"
in.value = "n4"

[[pass]]
id = "step"
stage = "tick"
kind = "map"
domain = "cells"
enabled = true

[[pass.node]]
id = "n10"
op = "lane.get"
config.lane = "health"

[[pass.node]]
id = "n11"
op = "grid.count"
config.lane = "health"
config.neighborhood = "moore"
config.include_center = false
in.value = { cat = "health.I" }
in.when = { bool = true }

[[pass.node]]
id = "n12"
op = "math.sub"
in.a = { f32 = 1.0 }
in.b = { param = "infection_rate" }

[[pass.node]]
id = "n13"
op = "math.powi"
config.max_exponent = 8
in.base = "n12"
in.exponent = "n11"

[[pass.node]]
id = "n14"
op = "rand.float"
config.key = 1251800922
in.max = { f32 = 1.0 }

[[pass.node]]
id = "n15"
op = "cmp.ge"
in.a = "n14"
in.b = "n13"

[[pass.node]]
id = "n16"
op = "cmp.gt"
in.a = "n11"
in.b = { u32 = 0 }

[[pass.node]]
id = "n17"
op = "logic.and"
in.a = "n16"
in.b = "n15"

[[pass.node]]
id = "n18"
op = "cmp.lt"
in.a = "n14"
in.b = { param = "recovery_rate" }

[[pass.node]]
id = "n19"
op = "cat.transition"
config.category = "health"
config.rules = [
  { id = "infect", from = "S", to = "I", phase = 0 },
  { id = "recover", from = "I", to = "R", phase = 0 },
]
in.state = "n10"
in.rule.infect.when = "n17"
in.rule.recover.when = "n18"

[[pass.node]]
id = "n20"
op = "lane.set"
config.lane = "health"
in.value = "n19.next"

[[pass]]
id = "counts"
stage = "stats"
kind = "map"
domain = "cells"
enabled = true

[[pass.node]]
id = "n30"
op = "lane.get"
config.lane = "health"

[[pass.node]]
id = "n31"
op = "stat.count_by"
config.category = "health"
in.value = "n30"

[[pass]]
id = "outbreak"
stage = "action"
action = "seed_outbreak"
kind = "map"
domain = "cells"
enabled = true

[[pass.node]]
id = "n40"
op = "lane.get"
config.lane = "health"

[[pass.node]]
id = "n41"
op = "cmp.eq"
in.a = "n40"
in.b = { cat = "health.S" }

[[pass.node]]
id = "n42"
op = "ctx.press_seed"

[[pass.node]]
id = "n43"
op = "ctx.index"

[[pass.node]]
id = "n44"
op = "rng.hash"
in.x = "n43"

[[pass.node]]
id = "n45"
op = "bits.xor"
in.a = "n42"
in.b = "n44"

[[pass.node]]
id = "n46"
op = "rng.hash"
in.x = "n45"

[[pass.node]]
id = "n47"
op = "rng.threshold"
in.p = { param = "initial_infected_pct" }

[[pass.node]]
id = "n48"
op = "rng.below"
in.bits = "n46"
in.threshold = "n47"

[[pass.node]]
id = "n49"
op = "logic.and"
in.a = "n41"
in.b = "n48"

[[pass.node]]
id = "n50"
op = "logic.select"
in.cond = "n49"
in.if_true = { cat = "health.I" }
in.if_false = "n40"

[[pass.node]]
id = "n51"
op = "lane.set"
config.lane = "health"
in.value = "n50"

[editor]
version = 1
next_id = 52
node.n1 = { pos = [40.0, 60.0] }
node.n2 = { pos = [40.0, 160.0] }
node.n3 = { pos = [260.0, 110.0] }
node.n4 = { pos = [460.0, 110.0] }
node.n5 = { pos = [660.0, 110.0] }
node.n10 = { pos = [40.0, 40.0], label = "This cell" }
node.n11 = { pos = [40.0, 160.0], label = "Infected neighbors" }
node.n12 = { pos = [260.0, 220.0] }
node.n13 = { pos = [460.0, 220.0], label = "Chance to stay safe" }
node.n14 = { pos = [260.0, 340.0] }
node.n15 = { pos = [660.0, 260.0] }
node.n16 = { pos = [460.0, 140.0] }
node.n17 = { pos = [860.0, 200.0], label = "Infected this tick" }
node.n18 = { pos = [660.0, 380.0], label = "Recovers this tick" }
node.n19 = { pos = [1060.0, 120.0] }
node.n20 = { pos = [1260.0, 120.0] }
node.n30 = { pos = [40.0, 40.0] }
node.n31 = { pos = [260.0, 40.0] }
node.n40 = { pos = [40.0, 40.0] }
node.n41 = { pos = [260.0, 40.0] }
node.n42 = { pos = [40.0, 160.0] }
node.n43 = { pos = [40.0, 260.0] }
node.n44 = { pos = [240.0, 260.0] }
node.n45 = { pos = [440.0, 200.0] }
node.n46 = { pos = [640.0, 200.0] }
node.n47 = { pos = [640.0, 320.0] }
node.n48 = { pos = [840.0, 250.0] }
node.n49 = { pos = [1040.0, 120.0] }
node.n50 = { pos = [1240.0, 120.0] }
node.n51 = { pos = [1440.0, 120.0] }
view."pass.step" = { pan = [0.0, 0.0], zoom = 1.0 }

[[editor.frame]]
scope = "pass.step"
title = "Read neighbors"
color = "blue"
members = ["n10", "n11"]

[[editor.frame]]
scope = "pass.step"
title = "Decide"
color = "gray"
members = ["n12", "n13", "n14", "n15", "n16", "n17", "n18", "n19"]

[[editor.frame]]
scope = "pass.outbreak"
title = "Per-press draw"
color = "gray"
members = ["n42", "n43", "n44", "n45", "n46", "n47", "n48"]
