# Ant foraging as a graph model. The walk draws counter-based numbers, so it matches the stock gpu_ants at tick 0
# and under its draw-free gate alone. The pick of the best neighbour and the two moves are functions, and the
# delivery is one expression, so the walk stays a canvas of under 40 nodes.
format = "henad-model"
format_version = 1
kind = "graph"
id = "node_ants"
name = "Ant Foraging"
description = "Ants lay and follow pheromone trails between a nest and a food source, around obstacles"

[graph]
topology = "agents"
library = 1

[[target]]
backend = "gpu"
id = "node_ants"
name = "Ant Foraging (GPU)"
description = "Ants lay and follow pheromone trails between a nest and a food source, stepped entirely on the GPU"

[agents]
count = 2000
max_count = 5000000
width = 200.0
height = 200.0

[[category]]
id = "cargo"
variants = [
  { name = "Searching", label = "Searching", color = [232, 232, 240, 255] },
  { name = "Carrying", label = "Carrying food", color = [61, 213, 140, 255] },
]

[[category]]
id = "site"
variants = [
  { name = "Empty", label = "Empty", color = [14, 14, 18, 255] },
  { name = "Obstacle", label = "Obstacle", color = [90, 90, 98, 255] },
  { name = "Food", label = "Food source", color = [61, 213, 140, 255] },
  { name = "Home", label = "Nest", color = [242, 228, 92, 255] },
]

[[palette]]
id = "cells"
colors = [
  [14, 14, 18, 255],
  [16, 28, 48, 255],
  [18, 42, 76, 255],
  [20, 60, 110, 255],
  [22, 82, 150, 255],
  [26, 107, 192, 255],
  [46, 139, 232, 255],
  [48, 30, 16, 255],
  [74, 44, 18, 255],
  [108, 62, 20, 255],
  [148, 84, 22, 255],
  [190, 110, 26, 255],
  [232, 140, 46, 255],
  [90, 90, 98, 255],
  [61, 213, 140, 255],
  [242, 228, 92, 255],
]

[[lane]]
id = "pos"
domain = "agents"
type = "vec2f"
initial = { vec2f = [0.0, 0.0] }
role = "position"

[[lane]]
id = "last_step"
domain = "agents"
type = "u32"
storage = "u8"
initial = { u32 = 255 }

[[lane]]
id = "cargo"
domain = "agents"
type = "cat:cargo"
storage = "u8"
initial = { cat = "cargo.Searching" }

[[lane]]
id = "reward_held"
domain = "agents"
type = "f32"
initial = { f32 = 0.0 }

[[field]]
id = "pheromone"
type = "f32"
layers = ["to_food", "to_home"]
static = false
combine = "max"
finish = "decay"
initial = { f32 = 0.0 }

[[field]]
id = "sites"
type = "cat:site"
layers = ["value"]
static = true
initial = { cat = "site.Empty" }

[[counter]]
id = "deliveries"

[[param]]
id = "update_cutdown"
label = "Trail Falloff"
kind = "f32"
min = 0.5
max = 1.0
default = 0.9
step = 0.01

[[param]]
id = "reward"
label = "Site Reward"
kind = "f32"
min = 0.1
max = 10.0
default = 1.0
step = 0.1

[[param]]
id = "momentum"
label = "Momentum Probability"
kind = "f32"
min = 0.0
max = 1.0
default = 0.8
step = 0.01

[[param]]
id = "random_action"
label = "Random Action Probability"
kind = "f32"
min = 0.0
max = 1.0
default = 0.1
step = 0.01

[[param]]
id = "evaporation"
label = "Evaporation"
kind = "f32"
min = 0.9
max = 1.0
default = 0.999
step = 0.001

[[stat]]
label = "Carrying Food"
from = "n152.count"
color = [61, 213, 140, 255]

[[stat]]
label = "Deliveries"
from = "n153.total"
color = [242, 228, 92, 255]

[[stat]]
label = "Total Pheromone"
from = "n166"
color = [46, 139, 232, 255]

[[action]]
id = "reset_colony"
label = "Reset colony"
runs = ["colony"]

