# Conway's Game of Life as a graph model, ported from the stock gpu_game_of_life.
# Randomise uses the press-seed form of the stock randomise.wgsl, so it equals the stock press by press.
format = "henad-model"
format_version = 1
kind = "graph"
id = "node_game_of_life"
name = "Game of Life"
description = "Conway's Game of Life on a toroidal grid"

[graph]
topology = "grid"
library = 1

[[target]]
backend = "gpu"
id = "node_game_of_life"
name = "Game of Life (GPU)"
description = "Conway's Game of Life on a toroidal grid, stepped entirely on the GPU"

[grid]
width = 1024
height = 1024
boundary = "torus"

[[category]]
id = "life"
variants = [
  { name = "Dead", label = "Dead", color = [21, 21, 21, 255] },
  { name = "Alive", label = "Alive", color = [0, 230, 118, 255] },
]

[[lane]]
id = "state"
domain = "cells"
type = "cat:life"
storage = "u8"
initial = { cat = "life.Dead" }

[[param]]
id = "density"
label = "Initial Density"
kind = "f32"
min = 0.0
max = 1.0
default = 0.3
step = 0.01

[[stat]]
label = "Alive"
from = "n21.Alive"
color = [0, 230, 118, 255]

[[action]]
id = "randomise"
label = "Randomise"
runs = []

[[action]]
id = "clear"
label = "Clear"
runs = []

[[pass]]
id = "seed"
stage = "init"
kind = "map"
domain = "cells"
enabled = true
draw_order = ["n2"]

[[pass.node]]
id = "n1"
op = "rng.threshold"
in.p = { param = "density" }

[[pass.node]]
id = "n2"
op = "stream.bits"
in.when = { bool = true }

[[pass.node]]
id = "n3"
op = "cmp.lt"
in.a = "n2"
in.b = "n1"

[[pass.node]]
id = "n4"
op = "logic.select"
in.cond = "n3"
in.if_true = { cat = "life.Alive" }
in.if_false = { cat = "life.Dead" }

[[pass.node]]
id = "n5"
op = "lane.set"
config.lane = "state"
in.value = "n4"

[[pass]]
id = "step"
stage = "tick"
kind = "map"
domain = "cells"
enabled = true

[[pass.node]]
id = "n10"
op = "lane.get"
config.lane = "state"

[[pass.node]]
id = "n11"
op = "grid.count"
config.lane = "state"
config.neighborhood = "moore"
config.include_center = false
in.value = { cat = "life.Alive" }
in.when = { bool = true }

[[pass.node]]
id = "n12"
op = "grid.life_like"
config.category = "life"
config.birth = [3]
config.survive = [2, 3]
config.dead = "Dead"
config.alive = "Alive"
in.cell = "n10"
in.count = "n11"

[[pass.node]]
id = "n13"
op = "lane.set"
config.lane = "state"
in.value = "n12"

[[pass]]
id = "counts"
stage = "stats"
kind = "map"
domain = "cells"
enabled = true

[[pass.node]]
id = "n20"
op = "lane.get"
config.lane = "state"

[[pass.node]]
id = "n21"
op = "stat.count_by"
config.category = "life"
in.value = "n20"

[[pass]]
id = "randomise_cells"
stage = "action"
action = "randomise"
kind = "map"
domain = "cells"
enabled = true

[[pass.node]]
id = "n30"
op = "ctx.press_seed"

[[pass.node]]
id = "n31"
op = "ctx.index"

[[pass.node]]
id = "n32"
op = "rng.hash"
in.x = "n31"

[[pass.node]]
id = "n33"
op = "bits.xor"
in.a = "n30"
in.b = "n32"

[[pass.node]]
id = "n34"
op = "rng.hash"
in.x = "n33"

[[pass.node]]
id = "n35"
op = "rng.threshold"
in.p = { param = "density" }

[[pass.node]]
id = "n36"
op = "rng.below"
in.bits = "n34"
in.threshold = "n35"

[[pass.node]]
id = "n37"
op = "logic.select"
in.cond = "n36"
in.if_true = { cat = "life.Alive" }
in.if_false = { cat = "life.Dead" }

[[pass.node]]
id = "n38"
op = "lane.set"
config.lane = "state"
in.value = "n37"

[[pass]]
id = "clear_cells"
stage = "action"
action = "clear"
kind = "map"
domain = "cells"
enabled = true

[[pass.node]]
id = "n40"
op = "lane.set"
config.lane = "state"
in.value = { cat = "life.Dead" }

[editor]
version = 1
next_id = 41
node.n1 = { pos = [40.0, 60.0], label = "Alive threshold" }
node.n2 = { pos = [40.0, 160.0] }
node.n3 = { pos = [260.0, 110.0] }
node.n4 = { pos = [460.0, 110.0] }
node.n5 = { pos = [660.0, 110.0] }
node.n10 = { pos = [40.0, 40.0], label = "This cell" }
node.n11 = { pos = [40.0, 160.0], label = "Alive neighbors" }
node.n12 = { pos = [300.0, 100.0], label = "B3/S23" }
node.n13 = { pos = [540.0, 100.0] }
node.n20 = { pos = [40.0, 40.0] }
node.n21 = { pos = [260.0, 40.0] }
node.n40 = { pos = [40.0, 40.0] }
view."pass.step" = { pan = [0.0, 0.0], zoom = 1.0 }

[[editor.frame]]
scope = "pass.step"
title = "Read neighbors"
color = "blue"
members = ["n10", "n11"]
