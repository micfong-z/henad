format = "henad-model"
format_version = 1
kind = "sheet"

[sheet]
version = 1
id = "kinds"
name = "Line kinds"
purpose = "Every line kind the grid lowering writes, for its tests."
next_line = 12

[world]
made_of = "cells"
width = 8
height = 8
edges = "wrap"

[[cells.property]]
id = "status"
name = "Status"
type = "states"
states = [
  { id = "dead", name = "Dead", color = "#151515" },
  { id = "alive", name = "Alive", color = "#00E676" },
]

[cells.property.starts_as]
rule = "value"
value = { state = "dead" }

[[cells.property]]
id = "level"
name = "Level"
type = "number"

[cells.property.starts_as]
rule = "value"
value = 0

[[cells.property]]
id = "flag"
name = "Flag"
type = "yes_no"

[cells.property.starts_as]
rule = "value"
value = false

# Each tick, every cell
[[card]]
id = "cell_tick"
every = "cells"
runs = "each_tick"
lines = ["l1", "l2", "l3", "l4", "l5", "l6", "l7", "l9", "l10", "l11"]

# Alive around = count of the 8 cells around me whose Status is Alive
[card.line.l1]
kind = "count"
name = "Alive around"
around = "cells_8"

[card.line.l1.whose]
kind = "compare"
test = "is"
left = { their = "status" }
right = { state = "alive" }

# Flagged around = count of the 4 cells around me whose Flag is yes
[card.line.l2]
kind = "count"
name = "Flagged around"
around = "cells_4"

[card.line.l2.whose]
kind = "compare"
test = "is"
left = { their = "flag" }
right = true

# Flagged near = Flagged around is at least 1
[card.line.l3]
kind = "compare"
name = "Flagged near"
test = "at_least"
left = { result = "l2" }
right = 1

# Lone flag = all of Flagged near, none of my Flag is yes
[card.line.l4]
kind = "all_of"
name = "Lone flag"

[[card.line.l4.items]]
result = "l3"

[[card.line.l4.items]]
kind = "none_of"

[[card.line.l4.items.items]]
kind = "compare"
test = "is"
left = { my = "flag" }
right = true

# Set Level to 5, when Alive around is less than 1 or more than 3
[card.line.l5]
kind = "set"
property = "level"
value = 5

[card.line.l5.condition]
kind = "compare"
test = "outside"
left = { result = "l1" }
low = 1
high = 3

# otherwise (when line 5 does not apply) set Level to Alive around, always
[card.line.l6]
kind = "set"
property = "level"
value = { result = "l1" }

[card.line.l6.condition]
kind = "always"

# When any of my Status is Alive, Lone flag:
[card.line.l7]
kind = "when"
lines = ["l8"]

[card.line.l7.condition]
kind = "any_of"

[[card.line.l7.condition.items]]
kind = "compare"
test = "is"
left = { my = "status" }
right = { state = "alive" }

[[card.line.l7.condition.items]]
result = "l4"

# Set Flag to yes, always
[card.line.l8]
kind = "set"
property = "flag"
value = true

[card.line.l8.condition]
kind = "always"

# Become Alive from Dead, when Alive around is one of the numbers 3
[card.line.l9]
kind = "become"
property = "status"
new_state = "alive"
start_state = "dead"

[card.line.l9.condition]
kind = "compare"
test = "one_of"
left = { result = "l1" }
right = [3]

# Become Dead from Alive, when Alive around is within 1 of 0
[card.line.l10]
kind = "become"
property = "status"
new_state = "dead"
start_state = "alive"

[card.line.l10.condition]
kind = "compare"
test = "within"
left = { result = "l1" }
right = 0
tolerance = 1

# otherwise (when line 9 does not apply) become Alive from Dead, when my new Level is at least 5
[card.line.l11]
kind = "become"
property = "status"
new_state = "alive"
start_state = "dead"

[card.line.l11.condition]
kind = "compare"
test = "at_least"
left = { my_new = "level" }
right = 5
