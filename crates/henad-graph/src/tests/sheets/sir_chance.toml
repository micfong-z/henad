format = "henad-model"
format_version = 1
kind = "sheet"

[sheet]
version = 1
id = "sir_chance"
name = "SIR epidemic"
purpose = "A spatial SIR epidemic. Pattern to look for: a travelling wave of infection that leaves recovered cells behind it, and an epidemic curve that rises and falls."
next_line = 5

[world]
made_of = "cells"
width = 1024
height = 1024
edges = "wrap"

[[cells.property]]
id = "health"
name = "Health"
type = "states"
states = [
  { id = "susceptible", name = "Susceptible", color = "#007AF5" },
  { id = "infected", name = "Infected", color = "#E43748" },
  { id = "recovered", name = "Recovered", color = "#808080" },
]

[cells.property.starts_as]
rule = "by_chance"
key = 3604303036
otherwise = "susceptible"

[[cells.property.starts_as.row]]
state = "infected"
chance = { param = "initial_infected" }

[[parameter]]
id = "infection_chance"
name = "Infection chance"
type = "number"
min = 0
max = 1
default = 0.3
step = 0.01
means = "Chance per tick that one infected neighbour infects a susceptible cell"

[[parameter]]
id = "recovery_chance"
name = "Recovery chance"
type = "number"
min = 0
max = 1
default = 0.05
step = 0.01
means = "Chance per tick that an infected cell recovers"

[[parameter]]
id = "initial_infected"
name = "Initial infected"
type = "number"
min = 0
max = 1
default = 0.01
step = 0.001
format = "percent"

[[measure]]
id = "susceptible"
name = "Susceptible"
color = "#007AF5"
rule = "count_in_state"
over = "cells"
property = "health"
state = "susceptible"

[[measure]]
id = "infected"
name = "Infected"
color = "#E43748"
rule = "count_in_state"
over = "cells"
property = "health"
state = "infected"

[[measure]]
id = "recovered"
name = "Recovered"
color = "#808080"
rule = "count_in_state"
over = "cells"
property = "health"
state = "recovered"

[color.cells]
rule = "by_state"
property = "health"

[[button]]
id = "new_outbreak"
name = "New outbreak"

[[button.does]]
rule = "run_once"
card = "new_outbreak"

# Each tick, every cell
[[card]]
id = "cell_tick"
every = "cells"
runs = "each_tick"
lines = ["l1", "l2", "l3"]

# Infected neighbours = count of the 8 cells around me whose Health is Infected
[card.line.l1]
kind = "count"
name = "Infected neighbours"
around = "cells_8"

[card.line.l1.whose]
kind = "compare"
test = "is"
left = { their = "health" }
right = { state = "infected" }

# Become Infected from Susceptible, with chance Infection chance for each infected neighbour
[card.line.l2]
kind = "become"
key = 1135614760
property = "health"
new_state = "infected"
start_state = "susceptible"

[card.line.l2.condition]
kind = "chance"
chance = { param = "infection_chance" }
tries = { result = "l1" }

# Become Recovered from Infected, with chance Recovery chance
[card.line.l3]
kind = "become"
key = 2888050758
property = "health"
new_state = "recovered"
start_state = "infected"

[card.line.l3.condition]
kind = "chance"
chance = { param = "recovery_chance" }

# Lines of New outbreak: run once, every cell, when pressed
[[card]]
id = "new_outbreak"
every = "cells"
runs = "once"
lines = ["l4"]

# Become Infected from Susceptible, with chance Initial infected
[card.line.l4]
kind = "become"
key = 3427002746
property = "health"
new_state = "infected"
start_state = "susceptible"

[card.line.l4.condition]
kind = "chance"
chance = { param = "initial_infected" }
