[package]
name = "henad"
version.workspace = true
description = "A parallel agent-based modelling engine for millions of agents on one machine, with its app and its command line."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/henad"
readme = "README.md"
keywords = ["agent-based-model", "abm", "simulation", "parallel", "gpu"]
categories = ["simulation", "science"]

[features]
# The ten example models, at `henad::models`.
example-models = ["dep:henad-models"]
# The app as a library, at `henad::app`.
app = ["dep:henad-app"]
# The command line as a library, at `henad::cli`. It adds nothing on wasm32.
cli = ["dep:henad-cli"]
# The checks a model's tests run against its entry, at `henad::testing`.
testing = ["henad-explore/testing"]

[dependencies]
henad-core = { workspace = true }
henad-compute = { workspace = true }
henad-explore = { workspace = true }
henad-models = { workspace = true, optional = true }
henad-app = { workspace = true, optional = true }
bytemuck = { workspace = true }

# henad-cli steps GPU models on a headless device, which only a native target has.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
henad-cli = { workspace = true, optional = true }

[[example]]
name = "complete"
required-features = ["example-models", "app"]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["example-models", "cli", "app", "testing"]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
