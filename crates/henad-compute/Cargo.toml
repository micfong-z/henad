[package]
name = "henad-compute"
version.workspace = true
description = "CPU and GPU engines that run Henad models, with their sim threads and parallel primitives."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/henad-compute"
readme = "README.md"
keywords = ["agent-based-model", "simulation", "gpu", "wgpu", "rayon"]
categories = ["simulation", "science", "concurrency"]

[dependencies]
henad-core = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
flume = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }

[build-dependencies]
wgsl_bindgen = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Only under atomics, where a `wgpu::Error` stops being `Send`. See `GpuContext::new`.
send_wrapper = { workspace = true }
web-sys = { workspace = true, features = ["Navigator", "Window"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "scatter"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
rustdoc-args = ["--cfg", "docsrs"]
