[package]
name = "henad-explore"
version.workspace = true
description = "Parameter sweeps, searches and result folders for Henad models."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/henad-explore"
readme = "README.md"
keywords = ["agent-based-model", "simulation", "parameter-sweep", "experiment", "optimization"]
categories = ["simulation", "science"]

[dependencies]
henad-core = { workspace = true }
henad-compute = { workspace = true }
henad-models = { workspace = true }
wgpu = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
rustdoc-args = ["--cfg", "docsrs"]
