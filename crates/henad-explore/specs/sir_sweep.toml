# An SIR sweep of 88 configs, 45 from a factorial block, 3 from a zip block and 40 from a Latin hypercube block.
# Each config runs 8 replicates, 704 runs in all.
# Run it with `henad-cli --spec crates/henad-explore/specs/sir_sweep.toml --out sir-sweep`.

# --8<-- [start:model]
model = "sir"

[set]                      # values every config shares, as --set gives them
grid_width = 128
grid_height = 128
# --8<-- [end:model]

# --8<-- [start:run]
[run]
steps = 1000
warmup = 0
replicates = 8
timeout_s = 600            # a run still stepping after 10 minutes is recorded as timed_out
stop = { condition = "Infected <= 0", min_tick = 20 }   # never stops before tick 20
# --8<-- [end:run]

# --8<-- [start:measure]
[measure]
stats_every = 5            # samples ticks warmup + j * 5, and the final tick
series_every = 25          # series.csv keeps every fifth sample, plus the final one
default_reducers = true    # final, min, max and mean of every stat column
reducers = [
  { column = "Infected", kinds = ["argmax", "first<=10", "mean@200..600"] },
]
# --8<-- [end:measure]

# --8<-- [start:seeds]
[seeds]
root = 42
scheme = "common"          # replicate r of every config shares a seed, and "independent" gives each run its own
# --8<-- [end:seeds]

# --8<-- [start:actions]
[[action]]
id = "seed_outbreak"
name = "second_wave"       # the name factors and the action.second_wave column use, the id when left out
tick = 400                 # fires after the step that reaches tick 400, unless a block varies it
# --8<-- [end:actions]

# --8<-- [start:factorial]
# Block 0, 5 x 3 x 3 = 45 configs. The first factor varies slowest and the last fastest.
[[block]]
design = "factorial"
factors = [
  { param = "infection_rate", range = { min = 0.1, max = 0.5, step = 0.1 } },
  { param = "recovery_rate", values = [0.02, 0.05, 0.1] },
  { action = "second_wave", values = [200, 400, 600] },
]
# --8<-- [end:factorial]

# --8<-- [start:zip]
# Block 1, 3 configs. Config i takes level i of every factor.
[[block]]
design = "zip"
factors = [
  { param = "infection_rate", values = [0.2, 0.3, 0.4] },
  { param = "initial_infected_pct", values = [0.001, 0.01, 0.05] },
]
# --8<-- [end:zip]

# --8<-- [start:lhs]
# Block 2, 40 configs in a Latin hypercube. Each range is split into 40 strata, one sample in each.
# "random" draws each value on its own instead. Both take design_seed = N, derived from the root seed when left out.
[[block]]
design = "lhs"
samples = 40
factors = [
  { param = "infection_rate", range = { min = 0.05, max = 0.95 } },
  { param = "recovery_rate", range = { min = 0.01, max = 0.2 } },
]
# --8<-- [end:lhs]

# --8<-- [start:execution]
[execution]                # spreads the runs over the machine, and never changes a result
concurrent = "auto"
# --8<-- [end:execution]
