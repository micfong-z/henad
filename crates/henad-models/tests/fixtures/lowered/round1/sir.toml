# Round 1 SIR, lowered by hand.
# Infected neighbours = count of the 8 cells around me whose Health is Infected;
# Become Infected if Susceptible with chance Infection chance for each of Infected neighbours;
# Become Recovered if Infected with chance Recovery chance. Button Seed outbreak runs one line once.
format = "henad-model"
format_version = 1
kind = "graph"
id = "r1_sir"
name = "SIR epidemic (round 1)"
description = "Round 1 author model lowered to library 1"

[graph]
topology = "grid"
library = 1

[[target]]
backend = "gpu"
id = "r1_sir"
name = "SIR epidemic (round 1)"
description = "Round 1 author model lowered to library 1"

[grid]
width = 1024
height = 1024
boundary = "torus"

[[category]]
id = "health"
variants = [
  { name = "Susceptible", label = "Susceptible", color = [0, 122, 245, 255] },
  { name = "Infected", label = "Infected", color = [228, 55, 72, 255] },
  { name = "Recovered", label = "Recovered", color = [128, 128, 128, 255] },
]

[[lane]]
id = "health"
domain = "cells"
type = "cat:health"
storage = "u8"
initial = { cat = "health.Susceptible" }

[[param]]
id = "infection_chance"
label = "Infection chance"
kind = "f32"
min = 0.0
max = 1.0
default = 0.3
step = 0.01

[[param]]
id = "recovery_chance"
label = "Recovery chance"
kind = "f32"
min = 0.0
max = 1.0
default = 0.05
step = 0.01

[[param]]
id = "initial_infected"
label = "Initial infected"
kind = "f32"
min = 0.0
max = 1.0
default = 0.01
step = 0.001
format = "percent"

[[stat]]
label = "Susceptible"
from = "n31.Susceptible"
color = [0, 122, 245, 255]

[[stat]]
label = "Infected"
from = "n31.Infected"
color = [228, 55, 72, 255]

[[stat]]
label = "Recovered"
from = "n31.Recovered"
color = [128, 128, 128, 255]

[[action]]
id = "seed_outbreak"
label = "Seed outbreak"
runs = []

[[pass]]
id = "start_cells"
stage = "init"
kind = "map"
domain = "cells"
enabled = true

[[pass.node]]
id = "n1"
op = "rand.chance"
config.key = 3100000201
in.p = { param = "initial_infected" }

[[pass.node]]
id = "n2"
op = "logic.select"
in.cond = "n1"
in.if_true = { cat = "health.Infected" }
in.if_false = { cat = "health.Susceptible" }

[[pass.node]]
id = "n3"
op = "lane.set"
config.lane = "health"
in.value = "n2"

[[pass]]
id = "tick_cells"
stage = "tick"
kind = "map"
domain = "cells"
enabled = true

[[pass.node]]
id = "n10"
op = "lane.get"
config.lane = "health"

[[pass.node]]
id = "n11"
op = "grid.count"
config.lane = "health"
config.neighborhood = "moore"
config.include_center = false
in.value = { cat = "health.Infected" }
in.when = { bool = true }

# "with chance p for each of n" is 1 - (1 - p)^n, one draw.
[[pass.node]]
id = "n12"
op = "math.sub"
in.a = { f32 = 1.0 }
in.b = { param = "infection_chance" }

[[pass.node]]
id = "n13"
op = "math.powi"
config.max_exponent = 8
in.base = "n12"
in.exponent = "n11"

[[pass.node]]
id = "n14"
op = "math.sub"
in.a = { f32 = 1.0 }
in.b = "n13"

[[pass.node]]
id = "n15"
op = "rand.chance"
config.key = 3100000202
in.p = "n14"

[[pass.node]]
id = "n16"
op = "rand.chance"
config.key = 3100000203
in.p = { param = "recovery_chance" }

[[pass.node]]
id = "n17"
op = "cat.transition"
config.category = "health"
config.rules = [
  { id = "line_2", from = "Susceptible", to = "Infected", phase = 0 },
  { id = "line_3", from = "Infected", to = "Recovered", phase = 0 },
]
in.state = "n10"
in.rule.line_2.when = "n15"
in.rule.line_3.when = "n16"

[[pass.node]]
id = "n18"
op = "lane.set"
config.lane = "health"
in.value = "n17.next"

[[pass]]
id = "measures_cells"
stage = "stats"
kind = "map"
domain = "cells"
enabled = true

[[pass.node]]
id = "n30"
op = "lane.get"
config.lane = "health"

[[pass.node]]
id = "n31"
op = "stat.count_by"
config.category = "health"
in.value = "n30"

# Button Seed outbreak: Run once, every cell: Become Infected if Susceptible with chance Initial infected.
[[pass]]
id = "button_seed_outbreak"
stage = "action"
action = "seed_outbreak"
kind = "map"
domain = "cells"
enabled = true

[[pass.node]]
id = "n40"
op = "lane.get"
config.lane = "health"

[[pass.node]]
id = "n41"
op = "rand.chance"
config.key = 3100000204
in.p = { param = "initial_infected" }

[[pass.node]]
id = "n42"
op = "cat.transition"
config.category = "health"
config.rules = [
  { id = "line_1", from = "Susceptible", to = "Infected", phase = 0 },
]
in.state = "n40"
in.rule.line_1.when = "n41"

[[pass.node]]
id = "n43"
op = "lane.set"
config.lane = "health"
in.value = "n42.next"
