in.a = "n44"
in.b = "n45"

[[pass.node]]
id = "n47"
op = "logic.select"
in.cond = "n36"
in.if_true = "n46"
in.if_false = { vec2f = [0.0, 0.0] }

[[pass.node]]
id = "n48"
op = "math.add"
in.a = "n21"
in.b = "n42"

[[pass.node]]
id = "n49"
