# The port of the stock gpu_boids shader tree as a graph model: its association, its wrap and its action.
format = "henad-model"
format_version = 1
kind = "graph"
id = "node_gpu_boids"
name = "Boids Flocking (GPU)"
description = "A simulation of flocking behavior in a group of boids, stepped entirely on the GPU"

[graph]
topology = "agents"
library = 1

[[target]]
backend = "gpu"
id = "node_gpu_boids"
name = "Boids Flocking (GPU)"
description = "A simulation of flocking behavior in a group of boids, stepped entirely on the GPU"

[agents]
count = 50000
max_count = 1000000
width = 1000.0
height = 1000.0

[[palette]]
id = "heading"
colors = [
  [228, 55, 72, 255],
  [240, 122, 40, 255],
  [255, 193, 7, 255],
  [139, 195, 74, 255],
  [30, 168, 124, 255],
  [0, 158, 200, 255],
  [0, 122, 245, 255],
  [142, 84, 216, 255],
]

[[lane]]
id = "pos"
domain = "agents"
type = "vec2f"
initial = { vec2f = [0.0, 0.0] }
role = "position"

[[lane]]
id = "vel"
domain = "agents"
type = "vec2f"
initial = { vec2f = [0.0, 0.0] }

[[param]]
id = "visual_range"
label = "Visual Range"
kind = "f32"
min = 1.0
max = 200.0
default = 50.0
step = 1.0

[[param]]
id = "protected_range"
label = "Protected Range"
kind = "f32"
min = 0.5
max = 50.0
default = 8.0
step = 0.5

[[param]]
id = "separation"
label = "Separation"
kind = "f32"
min = 0.0
max = 2.0
default = 0.05
step = 0.01

[[param]]
id = "alignment"
label = "Alignment"
kind = "f32"
min = 0.0
max = 2.0
default = 0.05
step = 0.01

[[param]]
id = "cohesion"
label = "Cohesion"
kind = "f32"
min = 0.0
max = 0.01
default = 0.0005
step = 0.0001

[[param]]
id = "max_speed"
label = "Max Speed"
kind = "f32"
min = 1.0
max = 50.0
default = 15.0
step = 0.5

[[param]]
id = "min_speed"
label = "Min Speed"
kind = "f32"
min = 0.5
max = 20.0
default = 3.0
step = 0.5

[[stat]]
label = "Average Speed"
from = "n72.mean"
color = [255, 193, 7, 255]

[[stat]]
label = "Average Velocity"
from = "n73.mean"
color = [0, 122, 245, 255]

[[action]]
