[package]
name = "my-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
default-run = "my-model"

[features]
default = ["app", "cli"]
app = ["henad/app", "dep:env_logger", "dep:wasm-bindgen-futures"]
cli = ["henad/cli"]

[[bin]]
name = "my-model"
path = "src/main.rs"
required-features = ["app"]

[[bin]]
name = "my-model-cli"
path = "src/bin/my-model-cli.rs"
required-features = ["cli"]

[dependencies]
henad = "0.3"
log = "0.4"

# The app alone uses these two dependencies. A crate that turns `app` off builds neither dependency.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }

[build-dependencies]
henad-build = "0.3"

[dev-dependencies]
henad = { version = "0.3", features = ["testing"] }

[lints.rust]
# The generated shader bindings allow this lint in their own module. Under `forbid`, that `allow` is an error.
unsafe_code = "deny"

# --8<-- [start:profile]
# The kernels expand in this crate, through `agent_lanes!` and the engine generics, at this crate's opt-level.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
# --8<-- [end:profile]
