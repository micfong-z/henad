# Threads on the web need atomics, a shared memory, and the thread-local storage exports wasm-bindgen reads. A
# wasm-only flag of your own goes into this array. An exported `RUSTFLAGS` or `CARGO_ENCODED_RUSTFLAGS` would replace
# it, and `scripts/build_web.sh` refuses to run while either is set.
[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals,+simd128",
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--import-memory",
    "-C", "link-arg=--max-memory=4294967296",
    "-C", "link-arg=--export=__heap_base",
    "-C", "link-arg=--export=__wasm_init_tls",
    "-C", "link-arg=--export=__tls_size",
    "-C", "link-arg=--export=__tls_align",
    "-C", "link-arg=--export=__tls_base",
]
