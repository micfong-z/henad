name: Docs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: zensical build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # `--locked` fails rather than silently resolving a newer Zensical than uv.lock pins.
      - name: Build
        run: uv run --locked zensical build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy to Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
