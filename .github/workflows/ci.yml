name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy + wasm + licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # `--all-targets` links henad-app, which needs eframe's X11/xkb libs.
      - name: Install eframe build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      # Subsumes `cargo check --all-targets`, which check.sh runs first only for the faster failure.
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -W clippy::all

      # Without atomics, so a `std::thread` reaching the web build fails here. henad-app is left
      # out because `wasm-bindgen-rayon` refuses to compile without them, and the `web` job builds
      # it the way it actually ships.
      - name: wasm typecheck
        run: cargo check --locked -p henad-core -p henad-compute -p henad-models -p henad-explore --all-features --lib --target wasm32-unknown-unknown

      # Without `--all-features`, which would turn on the facade's `app` and with it henad-app. henad-cli sits behind
      # a native target gate and never joins.
      - name: Facade wasm typecheck
        run: |
          cargo check --locked -p henad --lib --target wasm32-unknown-unknown
          cargo check --locked -p henad --features example-models,testing --lib --target wasm32-unknown-unknown

      - name: Install nightly
        run: |
          rustup toolchain install "$(cat templates/model-project/scripts/web-toolchain)" --profile minimal \
            --component rust-src,clippy --target wasm32-unknown-unknown

      # The `cfg` branches only a threaded web build compiles. Stable never sets `target_feature = "atomics"`, and no
      # build-std is needed to lint. A target directory of its own keeps the native cache valid.
      - name: clippy with atomics
        env:
          CARGO_TARGET_DIR: target/clippy-atomics
          RUSTFLAGS: -C target-feature=+atomics,+bulk-memory
        run: |
          export RUSTUP_TOOLCHAIN="$(cat templates/model-project/scripts/web-toolchain)"
          cargo clippy --locked -p henad-app --target wasm32-unknown-unknown -- -D warnings -W clippy::all
          cargo clippy --locked -p henad --features app,example-models --target wasm32-unknown-unknown \
            -- -D warnings -W clippy::all

      # The release workflow runs this extractor on a tag push, where a parsing bug would surface
      # at the worst possible moment.
      - name: Changelog extractor
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # Workspace versions, licence copies, and paths that climb out of a crate.
      - name: Packaging
        run: ./scripts/check_packaging.sh

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

      # `docs/license.html` is committed and deploys with the docs site, so a dependency change
      # that never regenerated it would publish a stale attribution page. cargo-about resolves
      # every target, which is why this output does not depend on the runner. The version is
      # pinned because a different one reformats the page.
      - name: Third-party licenses up to date
        env:
          CARGO_ABOUT_VERSION: "0.9.1"
        run: |
          asset="cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL --retry 5 \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$asset.tar.gz" \
            | tar -xzf - -C "$HOME/.cargo/bin" --strip-components=1 "$asset/cargo-about"
          cargo about generate about.hbs -o "$RUNNER_TEMP/license.html"
          diff -u docs/license.html "$RUNNER_TEMP/license.html" \
            || { echo "::error::docs/license.html is stale. Run: cargo about generate about.hbs -o docs/license.html"; exit 1; }

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            require_gpu: "1"
          - os: macos-15
            require_gpu: "1"
          # In-box WARP shows up as a dx12 adapter at full default limits, no Agility SDK needed.
          - os: windows-2025
            require_gpu: "1"
    env:
      HENAD_REQUIRE_GPU: ${{ matrix.require_gpu }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev \
            vulkan-tools

      # Nothing in the Ubuntu archive ships a lavapipe ICD any more (noble-updates moved to Mesa
      # 25.2.8, which dropped it), so take the prebuilt Mesa wgpu's own CI runs on. Bumping the
      # version needs a matching tag from https://github.com/gfx-rs/ci-build/releases.
      - name: Install lavapipe
        if: runner.os == 'Linux'
        env:
          MESA_VERSION: "26.1.3"
          CI_BINARY_BUILD: "build29"
        run: |
          curl -L --retry 5 --fail \
            "https://github.com/gfx-rs/ci-build/releases/download/$CI_BINARY_BUILD/mesa-$MESA_VERSION-linux-x86_64.tar.xz" \
            -o "$RUNNER_TEMP/mesa.tar.xz"
          mkdir -p "$RUNNER_TEMP/mesa"
          tar xpf "$RUNNER_TEMP/mesa.tar.xz" -C "$RUNNER_TEMP/mesa"

          lib_dir="$RUNNER_TEMP/mesa/lib/x86_64-linux-gnu"
          test -f "$lib_dir/libvulkan_lvp.so"

          # The bundled ICD hardcodes paths from the machine Mesa was built on.
          cat > "$RUNNER_TEMP/icd.json" <<EOF
          {
            "ICD": {
              "api_version": "1.4.348",
              "library_arch": "64",
              "library_path": "$lib_dir/libvulkan_lvp.so"
            },
            "file_format_version": "1.0.1"
          }
          EOF

          echo "VK_DRIVER_FILES=$RUNNER_TEMP/icd.json" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # GITHUB_ENV only reaches later steps, so the check has to be its own.
      - name: Vulkan summary
        if: runner.os == 'Linux'
        run: vulkaninfo --summary

      - uses: Swatinem/rust-cache@v2

      # Prints the adapter this runner actually got, which is the only way to tell a real skip from
      # a lost driver on the runners where HENAD_REQUIRE_GPU is off.
      - name: Runtime info
        run: cargo run --locked -p henad-cli -- --info

      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Doc tests
        run: cargo test --locked --workspace --doc

      # The README program. The workspace's doc tests turn on neither feature and compile the short crate doc alone.
      - name: Facade doc test
        run: cargo test --locked -p henad --doc --features example-models,app

  ports:
    name: reference ports build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # krABMaga depends on plotters off wasm, and plotters links system fontconfig through
      # font-kit. macOS reaches Core Text instead and needs nothing installed.
      - name: Install krABMaga build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/krabmaga

      # Outside the cargo workspace, so nothing else in CI ever touches it.
      - name: krABMaga
        run: |
          cargo check --locked --manifest-path benchmarks/krabmaga/Cargo.toml --all-targets
          cargo check --locked --manifest-path benchmarks/krabmaga/Cargo.toml --all-targets --features parallel

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Imports every model, which is as close to compiling as Python gets.
      - name: Mesa
        run: |
          uv run --project benchmarks/mesa python -c "
          import sys; sys.path.insert(0, 'benchmarks/mesa')
          import scenarios
          from models.ants import Ants
          from models.boids import Boids
          from models.game_of_life import GameOfLife
          from models.sir import Sir
          "
          uv run --project benchmarks/mesa python benchmarks/mesa/bench.py \
            --model game_of_life --grid 16 16 --steps 2 --reps 1

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Agents.jl
        run: |
          julia --project=benchmarks/agents_jl -e 'using Pkg; Pkg.instantiate()'
          julia --project=benchmarks/agents_jl benchmarks/agents_jl/bench.jl \
            --model game_of_life --grid 16 16 --steps 2 --reps 1

  web:
    name: trunk build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Threads need a std rebuilt with atomics, which needs nightly and `rust-src`.
      - name: Install nightly
        run: |
          rustup toolchain install "$(cat templates/model-project/scripts/web-toolchain)" --profile minimal \
            --component rust-src,clippy --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk
        run: |
          version="$(cat templates/model-project/scripts/trunk-version)"
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/v$version/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf - -C "$HOME/.cargo/bin"

      # Release, the build users deploy. Trunk runs `data-wasm-opt` only under `--release`.
      - name: Build
        run: ./scripts/build_web.sh build --release

      # The worker glue reaches the page through henad-app's re-export of `init_thread_pool`. Without it the thread
      # pool cannot start, and the build still succeeds.
      - name: Check the worker glue
        run: |
          grep -q wbg_rayon_start_worker dist/henad-app.js
          grep -q initThreadPool dist/henad-app.js
          ls dist/snippets/wasm-bindgen-rayon-*/src/workerHelpers.no-bundler.js

  # Packages every crate without building it, which catches a manifest that cargo refuses.
  package:
    name: cargo package
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: manifests
        with:
          filters: |
            changed:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/*/Cargo.toml'

      - name: Package
        if: steps.manifests.outputs.changed == 'true'
        run: cargo package --workspace --exclude henad-tutorial --no-verify --locked

  # Every feature of the facade builds alone, so none leans on another for an item it names.
  features:
    name: facade features
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # `app` links eframe, which needs the X11 and xkb libraries.
      - name: Install eframe build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: |
          cargo check --locked -p henad
          for feature in example-models app cli testing; do
            cargo check --locked -p henad --features "$feature"
          done

  # Holds the declared `rust-version` true.
  msrv:
    name: msrv
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install eframe build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Install 1.95
        run: rustup toolchain install 1.95 --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo +1.95 check --workspace --locked

  # The docs.rs builds, reproduced. henad-app's wasm32 half needs the atomics flags, which only a
  # nightly applies. They go in both variables, since only `RUSTFLAGS` reaches the dependencies.
  docs:
    name: docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install eframe build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Install nightly
        run: |
          rustup toolchain install "$(cat templates/model-project/scripts/web-toolchain)" --profile minimal \
            --component rust-src,clippy --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Native docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features

      - name: henad-app wasm32 docs
        env:
          CARGO_TARGET_DIR: target/docs-wasm
          RUSTFLAGS: -C target-feature=+atomics,+bulk-memory
          RUSTDOCFLAGS: -D warnings -C target-feature=+atomics,+bulk-memory
        run: |
          RUSTUP_TOOLCHAIN="$(cat templates/model-project/scripts/web-toolchain)" \
            cargo doc --locked -p henad-app --no-deps --target wasm32-unknown-unknown
