[workspace]

[package]
name = "krabmaga-bench"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "krabmaga-bench"
path = "src/main.rs"

[dependencies]
krabmaga = "=0.6.2"

[features]
parallel = ["krabmaga/parallel"]

# Cargo's own release defaults. krABMaga documents no profile of its own, and pinning lto and
# codegen-units here compiled it under settings henad-cli does not get.
[profile.release]
opt-level = 3
