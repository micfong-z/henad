[build]
filehash = false

# The worker pool shares memory with the page, which a browser allows only on a cross-origin-isolated
# page. Without these two headers Chrome still starts the build, on one thread. A host serving
# `dist/` has to send them as well.
[serve]
headers = { "Cross-Origin-Opener-Policy" = "same-origin", "Cross-Origin-Embedder-Policy" = "require-corp" }
