[project.extra.status]
ai-generated = "Nearly fully AI-generated."

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.snippets.dedent_subsections = true

[project.theme]
variant = "modern"
language = "en"

features = [
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.code.select",
    "content.tooltips",

    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.sections",
    "navigation.path",
    "navigation.expand",
    # "navigation.indexes",
    "navigation.top",

    "toc.follow",

    "search.highlight",
]
logo = "assets/logo.svg"

[project.theme.icon]
menu = "material/menu"
search = "material/magnify"
previous = "material/chevron-left"
next = "material/chevron-right"
repo = "fontawesome/brands/github"
edit = "material/file-edit-outline"
view = "material/file-code-outline"
top = "material/arrow-up"

[project.theme.icon.admonition]
note = "material/information-box-outline"
abstract = "material/note-text-outline"
info = "material/information-outline"
tip = "material/lightbulb-outline"
success = "material/check"
question = "material/help-circle"
warning = "material/alert-outline"
failure = "material/close-octagon-outline"
danger = "material/flash-alert-outline"
bug = "material/bug-outline"
example = "material/flask-outline"
quote = "material/format-quote-open-outline"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
accent = "orange"
toggle.icon = "material/theme-light-dark"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
accent = "orange"
scheme = "default"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
accent = "orange"
scheme = "slate"
toggle.icon = "material/weather-night"
toggle.name = "Switch to system preference"
