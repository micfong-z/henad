            "guide/app.md",
        ] },
        { "Writing your first model" = [
            "guide/first-model/game-of-life.md",
            "guide/first-model/ants.md",
            "guide/first-model/gpu-game-of-life.md",
            "guide/first-model/gpu-ants.md",
        ] },
    ] },
    { "Authoring" = [
        "authoring/index.md",
        { "Model traits" = [
            "authoring/grid-models.md",
            "authoring/agent-models.md",
            "authoring/gpu-grid-models.md",
            "authoring/gpu-agent-models.md",
        ] },
        { "Model features" = [
            "authoring/parameters.md",
            "authoring/statistics.md",
            "authoring/views.md",
            "authoring/fields.md",
        ] },
