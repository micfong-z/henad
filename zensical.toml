[project]
site_name = "Henad"
site_url = "https://micfong-z.github.io/henad/"
site_description = "A massively parallel agent-based modelling engine for millions of agents."
site_author = "Micfong"
copyright = "By <a href=\"https://micfong.space\">Micfong</a>. Licensed under <a href=\"https://github.com/micfong-z/henad/blob/master/LICENSE-MIT\">MIT</a> OR <a href=\"https://github.com/micfong-z/henad/blob/master/LICENSE-APACHE\">Apache-2.0</a>."

repo_url = "https://github.com/micfong-z/henad"
repo_name = "micfong-z/henad"
edit_uri = "edit/master/docs/"

docs_dir = "docs"
site_dir = "site"

extra_css = ["stylesheets/henad.css"]

nav = [
